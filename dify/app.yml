app:
  description: 一个会记住玩家上次恶作剧的 NPC；每次互动在 seekdb 中查询并保存。
  icon: 🎭
  icon_background: '#FFEAD5'
  mode: workflow
  name: 记仇 NPC
  use_icon_as_answer_icon: false
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: start-http
        source: start
        sourceHandle: source
        target: http
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: http-request}
      - id: http-end
        source: http
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: http-request, targetType: end}
    nodes:
      - id: start
        type: custom
        position: {x: 80, y: 240}
        data:
          type: start
          title: 玩家输入
          desc: 输入同一个玩家名两次，NPC 会引用第一次的恶作剧。
          variables:
            - {variable: player, label: 玩家名, type: text-input, required: true, max_length: 64, options: []}
            - {variable: prank, label: 恶作剧, type: paragraph, required: true, max_length: 240, options: []}
      - id: http
        type: custom
        position: {x: 390, y: 240}
        data:
          type: http-request
          title: seekdb 记忆回合
          desc: 查询该玩家上一回合，生成反应并写入本回合。
          method: post
          url: https://tianyuai.net/contest/dify-npc/turn
          headers: 'Content-Type: application/json'
          params: ''
          authorization:
            type: api-key
            config: {type: bearer, api_key: REPLACE_WITH_TOKEN}
          body:
            type: json
            data: '{"player":"{{#start.player#}}","prank":"{{#start.prank#}}"}'
          timeout: {connect: 10, read: 30, write: 10}
          variables: []
      - id: end
        type: custom
        position: {x: 700, y: 240}
        data:
          type: end
          title: NPC 回应
          desc: 返回 JSON；第二轮的 previous_prank 应来自 seekdb。
          outputs:
            - {variable: response, value_selector: [http, body]}
    viewport: {x: 0, y: 0, zoom: 1}
